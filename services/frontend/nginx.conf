# Mirrors GitHub Pages behavior locally: directory redirects keep the client's host/port, misses serve 404.html,
# and text assets are gzipped (GitHub Pages compresses them; without it local Lighthouse runs are not comparable).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/plain text/xml application/xml image/svg+xml application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
